<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo_12_UIRefresh</title>
    <link rel="stylesheet" href="./css/styles.css?v=kite-no-cooldown-20260801">
  </head>
  <body>
    <main class="shell">
      <section class="game-frame" aria-label="Demo_12_UIRefresh">
        <canvas id="gameCanvas"></canvas>

        <div class="role-overlay" id="roleOverlay">
          <div class="role-dialog" aria-label="选择阵营">
            <p class="eyebrow">Demo_12_UIRefresh</p>
            <h2 id="roleDialogTitle">选择阵营</h2>
            <div class="role-actions" id="roleActions">
              <button type="button" class="role-button survivor" data-role="survivor">
                <span>逃生阵营</span>
                <strong>Space 板窗 · E 救援/治疗/修理/开门</strong>
              </button>
              <button type="button" class="role-button hunter" data-role="hunter">
                <span>追捕阵营</span>
                <strong>J 攻击 · Space 牵起/挂椅/踩板窗</strong>
              </button>
              <div class="fun-mode-panel" aria-label="娱乐模式">
                <span class="fun-mode-title">娱乐模式</span>
                <div class="fun-mode-grid">
                  <button type="button" class="role-button fun-mode" data-mode="kiteSimulator">
                    <span>牵制模拟器</span>
                    <strong>选择逃生者与人机追捕者 · 只追你 · 不会淘汰</strong>
                  </button>
                  <button type="button" class="role-button fun-mode" data-mode="infiniteSawbone">
                    <span>无限车的锯骨</span>
                    <strong>开局二阶 · 无限耐久拉锯 · 移动靶练习</strong>
                  </button>
                  <button type="button" class="role-button fun-mode" data-mode="soulBinderPractice">
                    <span>无限借魂引魂师</span>
                    <strong>每人20魂印 · 借魂不消耗 · 移动靶练习</strong>
                  </button>
                </div>
              </div>
            </div>
            <div class="character-panel is-hidden" id="characterPanel">
              <div class="character-actions">
                <button type="button" class="back-button" id="characterBackButton">返回</button>
                <button type="button" class="back-button primary is-hidden" id="characterNextButton">下一步</button>
              </div>
              <form class="hidden-unlock is-hidden" id="hiddenUnlockForm" autocomplete="off">
                <input id="hiddenCodeInput" name="hiddenCode" type="text" inputmode="text" autocapitalize="none" spellcheck="false" placeholder="暗号">
                <button type="submit">确认</button>
              </form>
              <div class="hunter-survivor-preview is-hidden" id="hunterSurvivorPreview" aria-label="本局求生者身份"></div>
              <div class="character-grid">
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="clockmaker">
                  <span>钟表匠 · 修机位</span>
                  <strong>精准校准，Q 放置装置后可回溯隐身</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="actor">
                  <span>演员 · 救人位</span>
                  <strong>表演本能，Q 魔术秀，F 切换选项</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="messenger">
                  <span>信使 · 牵制位</span>
                  <strong>翻越更快，Q 投掷邮包打断追捕者</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="apprentice">
                  <span>学徒 · 辅助位</span>
                  <strong>Q 放针线包，受伤队友拾取后延迟回血</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="navigator">
                  <span>引航员 · 辅助位</span>
                  <strong>Q 两段拖拽设定航道，送一名队友定向滑行</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="medic">
                  <span>军医 · 救人位</span>
                    <strong>首抓获得应急撤离，Q 肾上腺素 6 秒 40% 加速延伤</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="perfumer">
                  <span>调香师 · 辅助位</span>
                  <strong>嗅感预警，Q 释放迷香；四次后点燃幻香大阵</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="fencer">
                  <span>击剑手 · 牵制位</span>
                  <strong>奔跑转向叠健步，Q 突刺无敌并可变向</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="fighter">
                  <span>格斗家 · 高难救人位</span>
                  <strong>J 破缚拳眩晕；眩晕四次后 Q 展开一次擂台</strong>
                </button>
                <button type="button" class="character-button survivor secret is-hidden" data-character-role="survivor" data-character="antiqueDealer" data-hidden-character="true">
                  <span>古董商 · 隐藏辅助位</span>
                  <strong>Q 展开机关箫，1-5 使用扫式、点刺、抡式、云门跳跃与转式加速</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="general">
                  <span>将军 · 救人位</span>
                  <strong>骑马被追击攒怒，满怒 Q 后撤冲刺撞退追捕者</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="shieldBearer">
                  <span>大盾手 · 牵制位</span>
                  <strong>Q 举盾减伤并承受击退，坚强每分钟抵消一次负面状态</strong>
                </button>
                <button type="button" class="character-button survivor" data-character-role="survivor" data-character="tuner">
                  <span>调律师 · 修机位</span>
                  <strong>修机积累共振，Q 放出回声带减速追捕者</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="standard">
                  <span>驯犬师</span>
                  <strong>Q 自动放犬追踪，咬中造成短暂眩晕</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="brute">
                  <span>震锤者</span>
                  <strong>按住 Q 蓄力，松开向前跃击并震荡破板</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="lanternKeeper">
                  <span>提灯人</span>
                  <strong>暗灯压修，Q 放置寄魂灯监视区域</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="sawbone">
                  <span>锯骨</span>
                  <strong>普攻叠流血，Q 拉锯；二阶只因命中或撞墙停</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="soulBinder">
                  <span>引魂师</span>
                  <strong>F 两段魂巡压机，一阶 Q 摄魂，二阶 E 借魂</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="mirrorGhost">
                  <span>镜鬼</span>
                  <strong>Q 限时镜幕，E 镜光；裂缝最多 6 条，二阶华镜</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="dancer">
                  <span>舞者</span>
                  <strong>Q 舞步拉出侵蚀舞线；一阶 E 旋步，二阶终曲</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="edictor">
                  <span>禁令官</span>
                  <strong>Q 布下封界陷阱，E 发射裁定钩子</strong>
                </button>
                <button type="button" class="character-button hunter" data-character-role="hunter" data-character="abyss">
                  <span>“深渊”</span>
                  <strong>注视积攒深渊值，沉没后以投影扰乱走位</strong>
                </button>
                <button type="button" class="character-button hunter secret is-hidden" data-character-role="hunter" data-character="twinSword" data-hidden-character="true">
                  <span>双生剑仙 · 隐藏监管者</span>
                  <strong>Q 双生切换，E/R 形态技能，一阶 G 双生之力，F 发射飞剑</strong>
                </button>
              </div>
              <div class="badge-panel" id="badgePanel" aria-label="徽章天赋">
                <div class="badge-header">
                  <span>徽章天赋</span>
                  <strong id="badgeLimitReadout">紫 0/2 · 蓝 0/4</strong>
                </div>
                <div class="badge-grid">
                  <button type="button" class="badge-button survivor blue" data-badge-role="survivor" data-badge-rarity="blue" data-badge="cipher">
                    <span>蓝 · 齿轮</span>
                    <strong>修理速度提高</strong>
                  </button>
                  <button type="button" class="badge-button survivor blue" data-badge-role="survivor" data-badge-rarity="blue" data-badge="kite">
                    <span>蓝 · 羽步</span>
                    <strong>翻越更快，吃刀加速更久</strong>
                  </button>
                  <button type="button" class="badge-button survivor blue" data-badge-role="survivor" data-badge-rarity="blue" data-badge="aid">
                    <span>蓝 · 援护</span>
                    <strong>治疗和救援更快</strong>
                  </button>
                  <button type="button" class="badge-button survivor blue" data-badge-role="survivor" data-badge-rarity="blue" data-badge="ember">
                    <span>蓝 · 余火</span>
                    <strong>倒地爬行更快，倒地前 3 秒额外加速 35%</strong>
                  </button>
                  <button type="button" class="badge-button survivor blue" data-badge-role="survivor" data-badge-rarity="blue" data-badge="physicianBenevolence">
                    <span>蓝 · 医者仁心</span>
                    <strong>每分钟一次，治疗成功后令目标额外回复 50 裂伤</strong>
                  </button>
                  <button type="button" class="badge-button survivor purple" data-badge-role="survivor" data-badge-rarity="purple" data-badge="adrenaline">
                    <span>紫 · 回光返照</span>
                    <strong>5 台机修完后回一格血，并加速 5 秒</strong>
                  </button>
                  <button type="button" class="badge-button survivor purple" data-badge-role="survivor" data-badge-rarity="purple" data-badge="borrowedTime">
                    <span>紫 · 搏命挣扎</span>
                    <strong>首次救人后双方 20 秒延迟结算伤害</strong>
                  </button>
                  <button type="button" class="badge-button survivor purple" data-badge-role="survivor" data-badge-rarity="purple" data-badge="flywheel">
                    <span>紫 · 飞轮效应</span>
                    <strong>L 向前冲刺 0.4 秒，期间无敌且移速翻倍，冷却 50 秒</strong>
                  </button>
                  <button type="button" class="badge-button survivor purple" data-badge-role="survivor" data-badge-rarity="purple" data-badge="kneeJerk">
                    <span>紫 · 膝跳反射</span>
                    <strong>翻板窗后 2 秒加速，板窗冷却分开计算</strong>
                  </button>
                  <button type="button" class="badge-button hunter purple" data-badge-role="hunter" data-badge-rarity="purple" data-badge="detention">
                    <span>紫 · 挽留</span>
                    <strong>5 台机修完后普攻命中直接倒地</strong>
                  </button>
                  <button type="button" class="badge-button hunter purple" data-badge-role="hunter" data-badge-rarity="purple" data-badge="rampage">
                    <span>紫 · 张狂</span>
                    <strong>每 30 秒获得 1 刀存在感，最多 2 次</strong>
                  </button>
                  <button type="button" class="badge-button hunter purple" data-badge-role="hunter" data-badge-rarity="purple" data-badge="trumpCard">
                    <span>紫 · 底牌切换</span>
                    <strong>M 重新选择辅助技能，每局一次</strong>
                  </button>
                  <button type="button" class="badge-button hunter purple" data-badge-role="hunter" data-badge-rarity="purple" data-badge="confinedSpace">
                    <span>紫 · 禁闭空间</span>
                    <strong>追捕者翻窗后封锁该窗 10 秒</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="wanted">
                    <span>蓝 · 通缉</span>
                    <strong>击倒逃生者后获得随机逃生者方向箭头</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="hunt">
                    <span>蓝 · 猎步</span>
                    <strong>追捕移速提高</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="blade">
                    <span>蓝 · 锋刃</span>
                    <strong>刀气范围提高</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="pressure">
                    <span>蓝 · 压迫</span>
                    <strong>挂椅淘汰进度略快</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="wipe">
                    <span>蓝 · 收刀</span>
                    <strong>命中擦刀和空刀后摇略短</strong>
                  </button>
                  <button type="button" class="badge-button hunter blue" data-badge-role="hunter" data-badge-rarity="blue" data-badge="criticalPoint">
                    <span>蓝 · 临界点</span>
                    <strong>五台机破译后，低于一格的技能伤害补至一格，每 20 秒一次</strong>
                  </button>
                </div>
              </div>
              <div class="practice-options is-hidden" id="kiteSimulatorOptions" aria-label="牵制模拟器训练规则">
                <div class="badge-header">
                  <span>牵制训练</span>
                  <strong>仅影响玩家</strong>
                </div>
                <button type="button" class="practice-option-button" id="kiteSimulatorNoCooldownButton" aria-pressed="false">
                  <span>无冷却</span>
                  <strong>玩家角色技能与徽章技能立即可用，可反复练习飞轮</strong>
                </button>
              </div>
              <div class="assist-panel is-hidden" id="assistPanel" aria-label="辅助技能">
                <div class="badge-header">
                  <span>辅助技能</span>
                  <strong id="assistLimitReadout">携带 1 个</strong>
                </div>
                <div class="assist-grid">
                  <button type="button" class="assist-button" data-assist="listen">
                    <span>1 · 聆听</span>
                    <strong>显示正在移动的逃生者位置</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="peeper">
                    <span>2 · 插眼</span>
                    <strong>放置眼位，范围内交互减速 50% 并指向目标</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="abnormal">
                    <span>3 · 失常</span>
                    <strong>1 秒攻击密码机，单台退度 60% 起逐次递减至 10%</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="patroller">
                    <span>4 · 巡视者</span>
                    <strong>放出可控制巡视者，咬中控制并减速</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="blink">
                    <span>5 · 闪现</span>
                    <strong>向前闪现，闪现前出刀延后结算</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="shift">
                    <span>6 · 移形</span>
                    <strong>瞄准放置远端门，并在脚底生成近端门</strong>
                  </button>
                  <button type="button" class="assist-button" data-assist="excitement">
                    <span>7 · 兴奋</span>
                    <strong>可在牵人中释放；免疫一次眩晕，眩晕中使用会立刻解除</strong>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="button" class="character-codex-button" id="characterCodexButton" aria-label="角色图鉴" title="角色图鉴">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
            <path d="M8 7h8M8 11h6" />
          </svg>
        </button>

        <div class="character-codex-overlay is-hidden" id="characterCodexOverlay" aria-hidden="true">
          <section class="character-codex" role="dialog" aria-modal="true" aria-labelledby="characterCodexTitle">
            <header class="character-codex-header">
              <div>
                <p class="eyebrow">Character Archive</p>
                <h2 id="characterCodexTitle">角色图鉴</h2>
              </div>
              <button type="button" class="character-codex-close" id="characterCodexClose" aria-label="关闭角色图鉴" title="关闭">×</button>
            </header>
            <div class="character-codex-tabs" role="tablist" aria-label="角色阵营">
              <button type="button" class="character-codex-tab is-selected" data-codex-role="survivor" role="tab" aria-selected="true">逃生者</button>
              <button type="button" class="character-codex-tab" data-codex-role="hunter" role="tab" aria-selected="false">追捕者</button>
            </div>
            <div class="character-codex-layout">
              <nav class="character-codex-list" id="characterCodexList" aria-label="角色列表"></nav>
              <article class="character-codex-detail" id="characterCodexDetail" aria-live="polite"></article>
            </div>
          </section>
        </div>

        <div class="hud hud-top">
          <div>
            <p class="eyebrow">Demo_12_UIRefresh</p>
            <h1>新UI开发原型</h1>
            <div class="hunter-presence-badge is-hidden" id="hunterPresenceBadge" aria-label="追捕阶数"></div>
          </div>
          <div class="cipher-banner" aria-label="密码机进度">
            <strong id="cipherStatusReadout">五台密码机尚未破译</strong>
          </div>
          <div class="survivor-status-panel">
            <div class="survivor-status-grid" id="survivorStatusGrid" aria-label="求生者状态">
              <div class="survivor-status-card"></div>
              <div class="survivor-status-card"></div>
              <div class="survivor-status-card"></div>
              <div class="survivor-status-card"></div>
            </div>
            <div class="quick-chat is-hidden" id="quickChat" aria-label="快捷消息">
              <div class="quick-chat-menu" id="quickChatMenu" hidden>
                <strong id="quickChatTargetReadout">发送目标：全队</strong>
                <button type="button" data-quick-chat="rescue">快来救救我</button>
                <button type="button" data-quick-chat="rescueClaim">我来救人</button>
                <button type="button" data-quick-chat="wait">先不要走</button>
                <button type="button" data-quick-chat="heal">我需要治疗</button>
                <button type="button" data-quick-chat="help">我需要帮助</button>
                <button type="button" data-quick-chat="repair">快修机</button>
              </div>
              <button type="button" class="quick-chat-toggle" id="quickChatToggle" aria-expanded="false">消息</button>
            </div>
          </div>
        </div>

        <div class="hud hud-bottom">
          <div class="cooldown-panel" id="cooldownPanel" aria-label="技能冷却">
            <div class="cooldown-chip">
              <span>操作</span>
              <strong id="controlsReadout">E / Space</strong>
            </div>
          </div>
        </div>

        <div class="touch-stick" id="touchStick" aria-hidden="true">
          <div class="touch-knob" id="touchKnob"></div>
        </div>

        <div class="touch-actions" id="touchActions" aria-label="触控操作">
          <button type="button" class="touch-action use" id="touchUseButton">使用</button>
          <button type="button" class="touch-action interact" id="touchInteractButton">交互</button>
          <button type="button" class="touch-action attack" id="touchAttackButton">攻击</button>
          <button type="button" class="touch-action skill" id="touchSkillButton">技能</button>
          <button type="button" class="touch-action shadow" id="touchShadowButton">灯影</button>
          <button type="button" class="touch-action actor-phantom is-hidden" id="touchActorPhantomButton">幻影</button>
          <button type="button" class="touch-action ghostfire is-hidden" id="touchGhostfireButton">鬼火吞噬</button>
        </div>
      </section>
    </main>

    <script src="./js/main.js?v=abyss-projection-pallet-stun-20260824"></script>
  </body>
</html>
